<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian Node - 国試対策ポータル</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-orange: #e67e22;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .portal-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            letter-spacing: 3px;
            color: var(--primary-color);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ポータルボタンの共通スタイル */
        .portal-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px 24px;
            text-decoration: none;
            text-align: left;
            display: block;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .portal-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
        }

        /* アプリごとのテーマカラー（左端の縦線） */
        .btn-anatomy::before { background-color: var(--accent-blue); }
        .btn-clinical::before { background-color: #e74c3c; }
        .btn-acutheory::before { background-color: var(--accent-orange); }

        .portal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(0,0,0,0.05);
            border-color: #cbd5e1;
        }

        .btn-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .btn-sub {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="portal-container">
    <h1>📌 Meridian Node</h1>
    <div class="subtitle">国家試験対策 高速演習ポータル</div>

    <div class="menu-grid">
        <!-- 既存のアプリ：AnatoHack -->
        <a href="https://kaoman0079-ops.github.io/AnatoHack/" class="portal-btn btn-anatomy">
            <div class="btn-title">解剖学 演習</div>
            <div class="btn-sub">AnatoHack - 定期試験対策・カテゴリ別</div>
        </a>

        <!-- 既存のアプリ：MedBlank (臨床医学各論) -->
        <a href="https://kaoman0079-ops.github.io/MedBlank/quiz4.html" class="portal-btn btn-clinical">
            <div class="btn-title">臨床医学各論</div>
            <div class="btn-sub">MedBlank - 4択演習マスター</div>
        </a>

        <!-- 新規追加：AcuTheory（「はりきゅう理論」へ名称変更） -->
        <a href="https://kaoman0079-ops.github.io/AcuTheory/" class="portal-btn btn-acutheory">
            <div class="btn-title">はりきゅう理論</div>
            <div class="btn-sub">AcuTheory - 4択演習マスター（シャッフル対応）</div>
        </a>
    </div>

    <footer>
        &copy; 2026 AnatoHack Project. All Rights Reserved.
    </footer>
</div>

</body>
</html>

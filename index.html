<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meridian Node - 鍼灸学習総合ポータル</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
    --main-bg:#F8F9FA;
    --card-bg:#FFFFFF;
    --text-main:#2C3E50;
    --text-dim:#7F8C8D;
    --border-color:#E1E8ED;
    --accent-blue:#2C3E50;
}
body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--main-bg);
    margin:0;color:var(--text-main);
}
.container{padding:30px 15px 60px;max-width:750px;margin:0 auto;}
.header-area{display:flex;align-items:center;justify-content:center;gap:25px;margin-bottom:30px;flex-wrap:wrap;}
.title-group{text-align:center;}
h1{font-size:2.2rem;font-weight:800;margin:0 0 5px;color:var(--accent-blue);}
.subtitle{font-size:.9rem;color:var(--text-dim);font-weight:600;}
.header-qr-box{display:flex;flex-direction:column;align-items:center;background:#fff;padding:8px;border:1px solid var(--border-color);border-radius:12px;}
#qrcode{width:85px;height:85px}
#qrcode img{width:85px!important;height:85px!important}
.header-qr-label{font-size:.65rem;font-weight:800;color:var(--text-dim);margin-top:5px}
.section-title{font-size:.85rem;font-weight:800;color:var(--text-dim);letter-spacing:.05em;margin:25px 0 10px 5px}
.news-box{background:#FFF9E6;border:1px solid #FFEAA7;border-radius:16px;padding:15px;margin-bottom:25px}
.news-item{display:flex;font-size:.9rem;font-weight:700;line-height:1.6;margin-bottom:10px}
.news-item:last-child{margin-bottom:0}
.news-date{color:#A4B0BE;margin-right:10px;white-space:nowrap}
.badge{font-size:.7rem;padding:2px 6px;border-radius:4px;color:#fff;font-weight:800;margin-right:8px}
.badge.new{background:#FF4757}
.badge.update{background:#FFA502}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.menu-card{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:20px;
    padding:22px 15px;
    text-align:center;
    text-decoration:none;
    color:var(--text-main);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:110px;
}
.menu-icon{font-size:2rem;margin-bottom:10px}
.menu-title{font-size:1.05rem;font-weight:800}
.menu-desc{font-size:.75rem;color:var(--text-dim);font-weight:600}
@media(max-width:480px){
    .menu-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<div class="header-area">
    <div class="title-group">
        <h1>Meridian Node</h1>
        <div class="subtitle">鍼灸学習総合ポータル</div>
    </div>
    <div class="header-qr-box">
        <div id="qrcode"></div>
        <div class="header-qr-label">SHARE</div>
    </div>
</div>

<div class="section-title">What's New</div>
<div class="news-box">
    <div class="news-item">
        <span class="news-date">2026/06/15</span>
        <span class="badge new">New</span>
        <span>新コンテンツ「AcuTheory（鍼灸理論）」を公開しました。</span>
    </div>
    <div class="news-item">
        <span class="news-date">2026/06/12</span>
        <span class="badge new">New</span>
        <span>「理学的検査・内科疾患クイズ」を公開！</span>
    </div>
</div>

<div class="section-title">Learning Systems</div>
<div class="menu-grid">

/AcuTheory/
    <span class="menu-icon">🧠</span>
    <span class="menu-title">AcuTheory</span>
    <span class="menu-desc">鍼灸理論・基礎整理</span>
</a>

/OrientClinix/
    <span class="menu-icon">💪</span>
    <span class="menu-title">東洋医学臨床論</span>
    <span class="menu-desc">前期テスト対応</span>
</a>

</div>
</div>

<script>
window.addEventListener('DOMContentLoaded',()=>{
    new QRCode(document.getElementById("qrcode"),{text:location.href,width:85,height:85});
});
</script>
</body>
</html>
